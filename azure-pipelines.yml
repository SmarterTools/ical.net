trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  solution: 'Ical.Net.sln'
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Test'
  inputs:
    command: 'test'
    projects: 'Ical.Net.Tests/Ical.Net.Tests.csproj'
    arguments: '--configuration $(buildConfiguration) --no-build'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/Ical.Net/bin/$(buildConfiguration)/net10.0'
    ArtifactName: 'Release'
    publishLocation: 'Container'
